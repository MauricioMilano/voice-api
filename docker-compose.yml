services:
  voice-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: voice-api:latest
    container_name: voice-api
    restart: unless-stopped
    ports:
      - "8080:8080"   # gateway + dashboard UI
      - "8001:8001"   # sidecar (exposed for debugging / direct calls)
    environment:
      APP_NAME: "VoiceAPI Gateway"
      SECRET_KEY: "${SECRET_KEY:-change-me-please-make-this-32-chars-min}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      # Where the SQLite DB lives. The volume ./data is mounted at /app/data.
      DATA_DIR: "/app/data"
      # Absolute path so it works regardless of which directory uvicorn launches from.
      DATABASE_URL: "sqlite:////app/data/voice_api.db"
      SIDECAR_BASE_URL: "http://127.0.0.1:8001"
      SIDECAR_TIMEOUT_SECONDS: "180"
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      STT_MODEL: "whisper-small"
      # Idle-eviction: release Whisper model from RAM after N seconds of disuse.
      # 0 disables eviction. Default 300s (~5 min). Cold-start ~2-5s after idle.
      WHISPER_IDLE_EVICTION_SECONDS: "${WHISPER_IDLE_EVICTION_SECONDS:-300}"
      # Whisper device: "auto" probes GPU once at startup and locks the result.
      # "cuda" forces GPU (errors out if unavailable). "cpu" forces CPU.
      # When GPU is enabled below (deploy block), the probe finds it and locks cuda.
      # On servers without GPU, the probe falls through to cpu automatically.
      WHISPER_DEVICE: "${WHISPER_DEVICE:-auto}"
      # ---- Logging (see README "Troubleshooting") ----
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"          # DEBUG | INFO | WARNING | ERROR
      LOG_FORMAT: "${LOG_FORMAT:-text}"        # text | json
      # For NVIDIA GPU acceleration on the whisper sidecar, uncomment:
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data:/app/data
      - ./sidecar-data/voices:/app/sidecar/voices
    # GPU acceleration is opt-in via the `gpu` profile. Use:
    #   docker compose up -d                     # CPU only (default)
    #   docker compose --profile gpu up -d       # GPU via NVIDIA runtime
    # The `gpu` profile is the explicit switch - no env var hack needed
    # because docker-compose doesn't support env interpolation in
    # `deploy.resources`. On hosts without `nvidia-container-toolkit`
    # installed, the gpu profile will fail loudly at `docker compose up`,
    # which is the right behavior (no silent CPU fallback at the docker level).